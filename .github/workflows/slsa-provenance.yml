name: SLSA Provenance

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Build Application Artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.hash.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Create build artifact
        run: |
          tar -czf tcc-discussion-hub-${{ github.sha }}.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='*.zip' \
            .

      - name: Generate artifact hash
        id: hash
        run: |
          DIGEST=$(sha256sum tcc-discussion-hub-${{ github.sha }}.tar.gz | cut -d ' ' -f 1)
          echo "digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Artifact SHA-256: ${DIGEST}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcc-discussion-hub-${{ github.sha }}
          path: tcc-discussion-hub-${{ github.sha }}.tar.gz
          retention-days: 90

  provenance:
    name: Generate SLSA Provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: |
        ${{ needs.build.outputs.artifact-digest }}
      upload-assets: true

  verify-provenance:
    name: Verify SLSA Provenance
    needs: [build, provenance]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.6.0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tcc-discussion-hub-${{ github.sha }}

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: multiple.intoto.jsonl

      - name: Verify provenance
        run: |
          slsa-verifier verify-artifact \
            tcc-discussion-hub-${{ github.sha }}.tar.gz \
            --provenance-path multiple.intoto.jsonl \
            --source-uri github.com/${{ github.repository }}
